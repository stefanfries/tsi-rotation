[project]
name = "tsi-rotation"
version = "0.1.0"
description = "TSI rotation backtest utilities"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "ta-lib>=0.7.1",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=9.1.1",
    "ruff>=0.15.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^reports/"]
